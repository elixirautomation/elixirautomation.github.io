# Yarn 4 is vendored at .yarn/releases and pinned via yarnPath (same as Sentinel).
# This makes a plain `yarn <cmd>` work even when an older global Yarn (e.g. Homebrew
# yarn 1.x) is first on PATH: Yarn 1 reads yarnPath and delegates to Yarn 4.
# Corepack also works, but is not required.
yarnPath: .yarn/releases/yarn-4.12.0.cjs

# node-modules linker keeps Vite, ESLint, and TypeScript resolution conventional.
nodeLinker: node-modules

enableTelemetry: false
